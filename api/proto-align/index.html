<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE — interface d'alignement (#9)</title>
  <link rel="stylesheet" href="proto.css">
</head>
<body>
  <!-- Bascule des états dégradés : hors du design évalué. -->
  <div id="switch">
    <span class="tag">maquette #9</span>
    <div id="degraded"></div>
  </div>
  <div id="banner" hidden></div>

  <div id="app">
    <header>
      <select id="pick"></select>
      <span id="state"></span>
      <span class="dim keys">← → frame (entre en détail) · ⇧ ×10 · ↑ ↓ candidat IMU ·
        E épingler · B (maintenu) flasher · Entrée confirmer · Espace lecture · Échap sortir</span>
    </header>

    <!-- La vidéo garde la plus grande surface : le début d'un mouvement fait 3 px. -->
    <main id="stage">
      <video id="v" playsinline></video>
      <canvas id="pinned" hidden></canvas>
      <div id="fallback" hidden></div>
      <div id="hud" hidden>
        <span id="hud-time" class="mono big"></span>
        <span id="hud-frame" class="mono"></span>
        <span id="hud-mode" class="chip"></span>
        <span id="blink-tag" class="chip warnchip" hidden>épinglée</span>
        <span id="hud-cadence" class="dim"></span>
      </div>
    </main>

    <!-- La seule réglette de la page : temps vidéo. Elle sert à arriver avant de
         poser, puis à se promener pour vérifier. Le marqueur montre l'ancre. -->
    <div class="strip">
      <div class="track">
        <input id="scrub" type="range" min="0" step="0.001" value="0">
        <span id="scrub-mark" hidden></span>
      </div>
      <span id="pin-state" class="dim"></span>
    </div>

    <!-- Courbe |ω| brute, en temps du take : choisir le candidat. -->
    <section class="curvebox">
      <canvas id="curve"></canvas>
      <div class="bar">
        <div id="cand-list" class="cands"></div>
        <span id="anchors" class="mono"></span>
        <button id="ok">Confirmer l'alignement</button>
      </div>
    </section>
  </div>

  <script type="module" src="proto.js"></script>
</body>
</html>
